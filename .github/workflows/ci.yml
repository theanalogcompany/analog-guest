name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands. Saves
# minutes on rapid review-feedback pushes; the latest run is the one we care
# about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mock env vars. None of the unit tests reference process.env, and the
      # codebase reads env vars lazily inside functions (not at module load),
      # so neither vitest nor next build need real values. These placeholders
      # protect against any future module-load env check; they're not
      # secrets and are safe to inline here.
      ANTHROPIC_API_KEY: ci-mock
      VOYAGE_API_KEY: ci-mock
      SENDBLUE_API_KEY_ID: ci-mock
      SENDBLUE_API_SECRET_KEY: ci-mock
      SENDBLUE_SIGNING_SECRET: ci-mock
      NEXT_PUBLIC_SUPABASE_URL: https://ci-mock.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-mock
      SUPABASE_SECRET_KEY: ci-mock
      NEXT_PUBLIC_POSTHOG_KEY: ci-mock
      NEXT_PUBLIC_POSTHOG_HOST: https://ci-mock.posthog.com
      SLACK_ALERTS_WEBHOOK_URL: ""
      GOOGLE_DRIVE_VENUES_FOLDER_ID: ci-mock
      AIRTABLE_API_KEY: ci-mock
      AIRTABLE_BASE_ID: ci-mock
      AIRTABLE_TABLE_ID: ci-mock
      CRON_SECRET: ci-mock
      TEST_VENUE_ID: ci-mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth, read here and asserted by
          # vitest.node-version.ts so CI and local cannot drift apart. This
          # used to hardcode `node-version: 20` while local development ran
          # v24 — a skew nothing detected, on a runtime that went end-of-life
          # in April 2026.
          node-version-file: .nvmrc
          cache: npm
      # Next.js incremental build cache. Runs before npm ci so hashFiles
      # never walks node_modules. A lockfile change invalidates fully; a
      # source-only change restores the nearest cache via restore-keys and
      # rebuilds incrementally.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx prettier --check .
      # Duplication gate: .jscpd.json holds the threshold. Baseline at gating
      # time was 5.12% duplicated lines (tests excluded); the gate exists to
      # catch growth, not to force a cleanup sprint.
      - run: npx jscpd
      # The junit reporter records per-test timings; the artifact makes slow
      # tests and suite-duration drift inspectable per run without gating
      # anything. --retry=1 is CI-only: a test that fails once then passes is
      # reported as flaky in the run output and the junit artifact - that is
      # a bug report against the test, not something to ignore. Local runs
      # stay retry-free so flakes surface loudly at the desk.
      - run: npx vitest run --retry=1 --reporter=default --reporter=junit --outputFile=vitest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit
          path: vitest-junit.xml
      - run: npm run build