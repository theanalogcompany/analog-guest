# TAC-297 commitments-due scheduled runner.
#
# The route handler at `app/api/cron/commitments-due/route.ts` is invoked
# hourly to transition open `guest_commitments` rows whose
# `expected_arrival` has elapsed into `pending_ack` (CAS-gated) and fire
# the operator APNs push. Vercel's Hobby tier caps cron granularity at
# daily/weekly; this project stays on Hobby, so we trigger the same
# endpoint from GitHub Actions instead — equivalent functionally, just
# moves the trigger off Vercel's cron surface.
#
# THIS IS NO LONGER THE PRIMARY TRIGGER (TAC-428). An hourly external cron
# on cron-job.org calls the same endpoint with EXTERNAL_CRON_SECRET; this
# workflow stays as a REDUNDANT NET so that service is not a single point of
# failure. Both are safe together because every transition is CAS-gated, so
# whichever tick arrives first wins the row and the other skips it.
#
# The reliability note that used to stand here said GH runs "can lag the
# target minute" and that an hourly heads-up "tolerates ±1h precision". Both
# were measured false: since 2026-08-27 GH has landed a run inside the venue's
# firing hour on 6 of 26 days, and 2 of the last 7, with gaps up to 7 hours.
# It does not lag the minute, it misses the hour. See CLAUDE.md, "Cron timing".
#
# Do not respond to a missed run by shortening the cron below. */5, */15 and
# hourly all produced 7-9 runs in 33 hours; asking for more buys nothing.

name: cron / commitments-due

on:
  schedule:
    # hourly on the hour, UTC. matches the original vercel.json entry.
    - cron: '0 * * * *'
  # manual trigger for ad-hoc testing — useful when seeding a scheduled
  # commitment with a near-now expected_arrival to verify the path end-to-end.
  workflow_dispatch:

jobs:
  fire:
    runs-on: ubuntu-latest
    # don't run on fork PRs — schedule/dispatch are repo-internal only
    if: github.repository == 'theanalogcompany/analog-guest'
    steps:
      - name: hit /api/cron/commitments-due
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_BASE_URL" ]; then
            echo "::error::PROD_BASE_URL repo variable is unset"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is unset"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PROD_BASE_URL}/api/cron/commitments-due"
