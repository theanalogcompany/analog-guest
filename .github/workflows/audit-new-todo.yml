name: Audit new Todo tickets

# Scheduled every 15 minutes, which GitHub runs hours apart (TAC-428).
# Audits one ticket per run. A ticket is audited
# once: the query skips anything that already carries an [AUDIT] or
# [AUDIT-CLAIM] comment, so re-running is safe.
#
# Which tickets are this repo's: the label narrows, the Repo: line decides
# (.claude/process.md, "Which repo works a ticket"). A ticket no repo can
# claim gets [AUDIT-SKIPPED] and Needs Decision instead of a guess.
#
# A run that leaves its ticket in Todo, for any reason, makes sure the ticket
# has an [AUDIT] comment and adds Needs Decision. The comment stops the
# ticket being retried on every run; the label stops it sitting in Todo
# where nobody looks.
#
# The surface step also counts the session's permission denials in the log
# on every run, and names the denied commands in its [AUDIT] notice.
#
# full_output (manual dispatch only) prints the session transcript into the
# run log. Off by default: this repo is public, so the log is too, and a
# transcript of a real ticket carries guest message text.
#
# The session's GitHub token is this job's own token, passed as github_token,
# so the permissions block below is what it can do: read the repo and read
# workflow runs, nothing else. Without github_token, claude-code-action swaps
# an OIDC token for the Claude GitHub App's token, which can write, and sets
# it as GH_TOKEN and GITHUB_TOKEN inside the session. That is also why there
# is no id-token: write: nothing here should be able to mint that token.
#
# Passing github_token also means the Claude step runs from a branch. The
# skip on a branch whose copy of this file differs from main's (run
# 35149594063) happens in the app-token exchange, which this workflow no
# longer does. build-ready.yml still exchanges, so it still skips.
#
# Scheduled workflows run only from the default branch. This does nothing
# until it is merged to main.

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [ticket-ready]
  workflow_dispatch:
    inputs:
      ticket:
        description: "Audit one specific ticket (e.g. TAC-395). Blank = whatever is newly in Todo."
        required: false
        type: string
      force:
        description: "Re-audit even if already audited"
        required: false
        default: false
        type: boolean
      full_output:
        description: "Print the session transcript in the run log. This repo is public: use it only on a fixture ticket."
        required: false
        default: false
        type: boolean

concurrency:
  group: ticket-audits-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # gh run list / gh run view, read-only, for claims about workflow runs.
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find a ticket needing an audit
        id: queue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          ONE_TICKET: ${{ inputs.ticket || github.event.client_payload.ticket }}
          FORCE: ${{ inputs.force }}
          LIMIT: "1"
        run: |
          set -euo pipefail

          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          if [ -n "${ONE_TICKET:-}" ] && [ "${FORCE:-false}" = "true" ]; then
            echo "tickets=$ONE_TICKET" >> "$GITHUB_OUTPUT"
            echo "defects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -sS https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$(jq -nc --arg repo "$REPO_NAME" '{
              query: "query($repo: String!) { issues(first: 100, filter: { team: { key: { eq: \"TAC\" } }, state: { name: { eq: \"Todo\" } }, labels: { some: { name: { eq: $repo } } } }) { nodes { id identifier description priority labels { nodes { name } } comments(first: 250) { nodes { body } } } } }",
              variables: { repo: $repo }
            }')")

          if ! echo "$RESPONSE" | jq -e '.data.issues.nodes' > /dev/null; then
            echo "::error::Linear query failed: $RESPONSE"
            exit 1
          fi

          # The repo rule from .claude/process.md. Kept identical in
          # build-ready.yml.
          RULES='
            def repo_labels: [.labels.nodes[].name | select(startswith("analog-"))];
            # Every analog-* name on the Repo: line, in order. [] with no line.
            def repo_line_names:
              [(.description // "") | capture("(?:^|\\n)[ \\t>*_]*Repos?[*_]*[ \\t]*:(?<line>[^\\n]*)"; "i") | .line]
              | if length == 0 then []
                else [.[0] | gsub("<[^>]*>"; "") | gsub("https?://[^\\s)>]*"; "") | scan("analog-[a-z]+(?:-[a-z]+)*"; "i") | ascii_downcase]
                end;
            def owner:
              repo_labels as $labels
              | repo_line_names as $named
              | ([$named[] | select(. as $n | $labels | any(. == $n))] | first) as $pick
              | if $pick != null then $pick
                elif ($named | length) > 0 then "defect:unlabelled"
                elif ($labels | length) == 1 then $labels[0]
                elif ($labels | length) == 0 then "none"
                else "defect:no-repo-line"
                end;
            def audited: [.comments.nodes[].body] | map(test("\\[AUDIT(-CLAIM)?\\]")) | any;
            def only($t): if $t == "" then . else map(select(.identifier == $t)) end;
            def has_label($name): [.labels.nodes[].name] | any(. == $name);
            # The first marker after the prefix, per .claude/process.md.
            def audit_skipped: [.comments.nodes[].body]
              | map(test("^\\s*\\*\\*\\[FROM CLAUDE CODE\\]\\*\\*\\s*\\[AUDIT-SKIPPED\\]")) | any;
          '

          # This repo's tickets, never audited, (optionally) the named one.
          TICKETS=$(echo "$RESPONSE" | jq -r \
            --arg repo "$REPO_NAME" \
            --arg only "${ONE_TICKET:-}" \
            --argjson limit "$LIMIT" "$RULES"'
            .data.issues.nodes
            | map(select(owner == $repo and (audited | not)))
            | only($only)
            | sort_by(if .priority == 0 then 99 else .priority end)
            | .[:$limit]
            | map(.identifier)
            | join(" ")
          ')

          # Tickets no repo can claim, not yet flagged. Flagged means an
          # [AUDIT-SKIPPED] comment AND Needs Decision: the label alone doesn't
          # count, because a ticket can be written with open questions and no
          # Repo: line. Removing the label without fixing the ticket re-flags it.
          DEFECTS=$(echo "$RESPONSE" | jq -c \
            --arg only "${ONE_TICKET:-}" "$RULES"'
            .data.issues.nodes
            | map(select(
                (owner | startswith("defect:"))
                and (audited | not)
                and ((audit_skipped and has_label("Needs Decision")) | not)
              ))
            | only($only)
            | map({ id, identifier, kind: owner, hasNeedsDecision: has_label("Needs Decision"), labels: (repo_labels | sort), named: repo_line_names })
          ')

          if [ -z "$TICKETS" ]; then
            echo "Nothing to audit."
          else
            echo "Auditing: $TICKETS"
          fi
          echo "tickets=$TICKETS" >> "$GITHUB_OUTPUT"
          echo "defects=$DEFECTS" >> "$GITHUB_OUTPUT"

      - name: Flag tickets no repo can claim
        if: steps.queue.outputs.defects != '' && steps.queue.outputs.defects != '[]'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DEFECTS: ${{ steps.queue.outputs.defects }}
        run: |
          set -euo pipefail

          gql() {
            curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$1"
          }

          LABEL_ID=$(gql '{"query":"query { issueLabels(filter: { name: { eq: \"Needs Decision\" } }) { nodes { id } } }"}' \
            | jq -r '.data.issueLabels.nodes[0].id // empty')
          if [ -z "$LABEL_ID" ]; then
            echo "::error::No Needs Decision label found in Linear."
            exit 1
          fi

          echo "$DEFECTS" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r .id)
            NAME=$(echo "$row" | jq -r .identifier)
            # "Replying here will not unblock it." is Jaipal's wording.
            TEXT=$(echo "$row" | jq -r '
              if .kind == "defect:no-repo-line"
              then "This ticket can'"'"'t be audited. It carries the \(.labels | join(" and ")) labels and has no Repo: line, so nothing says which repo the work starts in.\n\nAdd a Repo: line to the ticket. Replying here will not unblock it."
              else "This ticket can'"'"'t be audited. Its Repo: line names \(.named | join(" and ")), and the ticket carries no label for \(if (.named | length) == 1 then "it" else "any of them" end).\n\nFix the Repo: line or the repo label so they agree. Replying here will not unblock it."
              end')
            BODY="**[FROM CLAUDE CODE]**

          [AUDIT-SKIPPED] ${NAME}

          ${TEXT}"

            gql "$(jq -nc --arg id "$ID" --arg body "$BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
            if [ "$(echo "$row" | jq -r .hasNeedsDecision)" != "true" ]; then
              gql "$(jq -nc --arg id "$ID" --arg label "$LABEL_ID" \
                '{query: "mutation($id: String!, $label: String!) { issueAddLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
                | jq -e '.data.issueAddLabel.success' > /dev/null
            fi
            echo "flagged $NAME"
          done

      - name: Audit
        id: audit
        if: steps.queue.outputs.tickets != ''
        timeout-minutes: 50
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token, scoped by permissions above. See the header.
          github_token: ${{ github.token }}
          show_full_output: ${{ inputs.full_output == true }}
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Grep,Glob,Bash(curl:*),Bash(jq:*),Bash(git log:*),Bash(git show:*),Bash(rg:*),Bash(gh run list:*),Bash(gh run view:*)"
          prompt: |
            You are auditing a Linear ticket for the repo ${{ github.event.repository.name }}.

            Ticket to audit: ${{ steps.queue.outputs.tickets }}

            Read CLAUDE.md and .claude/process.md first. Then follow
            .claude/commands/audit-ticket.md — it is the specification for
            this task and it governs.

            LINEAR, FROM CI. There is no Linear MCP here. Use the GraphQL API
            with curl; the key is in the LINEAR_API_KEY environment variable.

            YOUR BASH IS RESTRICTED, AND A DENIED COMMAND FAILS SILENTLY.
            These are denied however you arrange them: expanding an
            environment variable ($LINEAR_API_KEY or ${LINEAR_API_KEY}),
            command substitution ($(...) or backticks), variable assignment
            (NAME=...), output redirection (>), and heredocs (<<). This
            workflow's own shell steps use those forms; you cannot. Pass the
            key with curl's own --variable and --expand-header, exactly as
            below. Use exactly these two forms.

            1. A read, with the request inline in single quotes:

                 curl -sS https://api.linear.app/graphql --variable %LINEAR_API_KEY --expand-header "Authorization: {{LINEAR_API_KEY}}" -H "Content-Type: application/json" -d '{"query":"query { issue(id: \"TAC-395\") { id identifier title description state { name } labels { nodes { id name } } comments(first: 250) { nodes { id body createdAt } } } }"}'

               Piping the response to jq is allowed: append | jq '...'.

            2. Every write, and any request too long to inline: use the Write
               tool to write the whole JSON request body to
               ${{ runner.temp }}/linear-request.json, replacing the file each
               time, then send the file:

                 curl -sS https://api.linear.app/graphql --variable %LINEAR_API_KEY --expand-header "Authorization: {{LINEAR_API_KEY}}" -H "Content-Type: application/json" -d @${{ runner.temp }}/linear-request.json

               The file is JSON, so escape newlines as \n and double quotes
               as \". A comment, for example:

                 {"query":"mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }","variables":{"id":"<issue uuid>","body":"**[FROM CLAUDE CODE]**\n\n[PLAN] ..."}}

            Read every response. Only "success": true means the write
            happened; anything else is a failed write, not a finished step.

            Post comments flat: never pass parentId. Change status with
            issueUpdate and stateId. Add or remove a label with
            issueAddLabel / issueRemoveLabel (id, labelId); never set labels
            through issueUpdate's labelIds, which replaces every label on the
            ticket. Resolve state and label ids by querying workflowStates
            and issueLabels. Never invent an id.

            The Write tool is for that request file only. Write nothing else.

            GITHUB RUN HISTORY. To check a ticket's claims about workflow
            runs, gh run list and gh run view are available, read-only. For
            example:

                 gh run list --repo ${{ github.repository }} --workflow=build-ready.yml --event schedule --limit 100 --json createdAt,conclusion | jq length

            Use them to read, never to act. An audit never changes the state
            of what it is auditing (audit-ticket.md): no cancels, no reruns,
            no dispatches. If the ticket says a command fails, check that from
            what gh run view shows; do not run the command to see. Shell loops
            (for, while) are denied: run one command at a time.

            Your [AUDIT] comment reports findings and their evidence, never
            how you worked. A refused command is not a finding: do not
            mention it. This workflow records refusals in [DENIALS].

            Your audit comment MUST contain the literal string [AUDIT]. That
            marker is what stops this workflow auditing the same ticket again
            on its next run. If you cannot complete an audit, still post a
            comment saying why, with [AUDIT] in it.

            The workflow has already checked, by the rule in .claude/process.md,
            that this repo works the ticket. A manually forced run skips that
            check, so audit-ticket.md's own repo check still applies.

            Never write code, never open a branch, never commit. The audit is
            read-only except for the Linear writes the command file specifies.

      - name: Surface an audit that left its ticket in Todo
        if: ${{ !cancelled() && steps.queue.outputs.tickets != '' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET: ${{ steps.queue.outputs.tickets }}
          STARTED: ${{ steps.queue.outputs.started }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gql() {
            curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$1"
          }

          # What the session did, from the action's own record of it
          # ($RUNNER_TEMP/claude-execution-output.json, written even when the
          # session fails). This log is public, so only counts are printed;
          # denied commands go to Linear, which is not.
          if [ -f "$EXECUTION_FILE" ]; then
            SESSION=$(jq -c --arg key "$LINEAR_API_KEY" '
              ([.[] | select(.type == "result")] | last) as $r
              | {
                  ended: ($r.subtype // "without a result"),
                  turns: ($r.num_turns // 0),
                  denials: (($r.permission_denials // []) | length),
                  denied: [ ($r.permission_denials // [])[:20][]
                    | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // (.tool_input | tostring))"
                    | gsub("\\s+"; " ") | gsub("`"; "\u02cb")
                    | (if ($key | length) > 0 then (split($key) | join("***")) else . end)
                    | .[0:200] ]
                }' "$EXECUTION_FILE")
          else
            SESSION='{"ended":"without a session record","turns":0,"denials":0,"denied":[]}'
          fi
          ENDED=$(echo "$SESSION" | jq -r .ended)
          TURNS=$(echo "$SESSION" | jq -r .turns)
          DENIALS=$(echo "$SESSION" | jq -r .denials)
          DENIED=$(echo "$SESSION" | jq -r '.denied | if length == 0 then "(none)" else map("- " + .) | join("\n") end')
          echo "Session ended $ENDED after $TURNS turns, with $DENIALS permission denials."
          if [ "$DENIALS" -gt 0 ]; then
            echo "::warning title=Permission denials::The session hit $DENIALS permission denials."
          fi

          # A run that succeeds with denials looks identical to one without,
          # so the denials go on the ticket as bookkeeping every time: a
          # denial on a finished run usually means a prompt teaches a form the
          # allowlist refuses. The automation ignores [DENIALS].
          FENCE='```'
          post_denials() {
            BODY="**[FROM CLAUDE CODE]**

          [DENIALS] $2 run=${GITHUB_RUN_ID} count=${DENIALS}

          This run's session did its work on this ticket but hit ${DENIALS} permission denials on the way. A denial on a run that otherwise succeeded usually means a prompt teaches a command the allowlist refuses. Bookkeeping: the automation ignores this comment.

          Denied, first 20, key redacted:

          ${FENCE}text
          ${DENIED}
          ${FENCE}

          Run: ${RUN_URL}"
            gql "$(jq -nc --arg id "$1" --arg body "$BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
            echo "$2: posted [DENIALS] for $DENIALS denial(s)."
          }

          ISSUE=$(gql "$(jq -nc --arg t "$TICKET" \
            '{query: "query($t: String!) { issue(id: $t) { id state { name } labels { nodes { name } } comments(first: 250) { nodes { body createdAt } } } }", variables: {t: $t}}')")
          ID=$(echo "$ISSUE" | jq -er '.data.issue.id')
          STATE=$(echo "$ISSUE" | jq -r '.data.issue.state.name')

          # A completed audit always moves the ticket out of Todo.
          if [ "$STATE" != "Todo" ]; then
            echo "$TICKET is in $STATE. The audit finished."
            if [ "$DENIALS" -gt 0 ]; then
              post_denials "$ID" "$TICKET"
            fi
            exit 0
          fi

          POSTED=$(echo "$ISSUE" | jq --arg started "$STARTED" '
            ($started | fromdateiso8601) as $since
            | [.data.issue.comments.nodes[]
                | select(.body | test("\\[AUDIT\\]"))
                | select((.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) >= $since)]
            | length')

          if [ "$POSTED" -gt 0 ]; then
            HEAD="[AUDIT] ${TICKET} is still in Todo after its audit run, so it has not been audited. The audit comment above says why. Run: ${RUN_URL}"
          else
            HEAD="[AUDIT] ${TICKET} did not finish, and the run posted no audit, so this ticket has not been audited. Run: ${RUN_URL}"
          fi

          FENCE='```'
          BODY="**[FROM CLAUDE CODE]**

          ${HEAD}

          The session ended ${ENDED} after ${TURNS} turns, with ${DENIALS} permission denials. Denied, first 20, key redacted:

          ${FENCE}text
          ${DENIED}
          ${FENCE}

          This comment stops every scheduled run retrying the ticket, and Needs Decision puts it in front of you. Replying here will not re-run the audit. Look at the run first: if it ran out of turns, the ticket may be too large to audit in one pass and need splitting. To audit it again:

          ${FENCE}
          gh workflow run audit-new-todo.yml --repo ${REPOSITORY} -f ticket=${TICKET} -f force=true
          ${FENCE}"

          gql "$(jq -nc --arg id "$ID" --arg body "$BODY" \
            '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
            | jq -e '.data.commentCreate.success' > /dev/null

          if echo "$ISSUE" | jq -e '[.data.issue.labels.nodes[].name] | any(. == "Needs Decision")' > /dev/null; then
            echo "$TICKET already carries Needs Decision."
            exit 0
          fi

          LABEL_ID=$(gql '{"query":"query { issueLabels(filter: { name: { eq: \"Needs Decision\" } }) { nodes { id } } }"}' \
            | jq -r '.data.issueLabels.nodes[0].id // empty')
          if [ -z "$LABEL_ID" ]; then
            echo "::error::No Needs Decision label found in Linear."
            exit 1
          fi
          gql "$(jq -nc --arg id "$ID" --arg label "$LABEL_ID" \
            '{query: "mutation($id: String!, $label: String!) { issueAddLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
            | jq -e '.data.issueAddLabel.success' > /dev/null
          echo "Surfaced $TICKET with Needs Decision."
