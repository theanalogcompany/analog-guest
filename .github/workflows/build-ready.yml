name: Build ready tickets

# Two jobs of one workflow, scheduled every 15 minutes, which GitHub runs
# hours apart (TAC-428):
#
#   START   — a Ready ticket with no Blocked On label. Runs /work-ticket,
#             which plans, posts [PLAN], and adds Needs Decision for
#             approval. It does not build unattended.
#
#   RESUME  — a Ready or In Progress ticket carrying Needs Decision or Needs
#             Action, whose newest comment is human input. The ruling has
#             landed, so /work-ticket picks up where it stopped.
#
# Either way, a ticket another session has is skipped, and the log says why
# (TAC-448). scripts/claims.mjs decides: a local session's [CLAIM] that is
# not released, a [POLLING-STATE], or a commit on the ticket's branch by
# anyone but the build session, each within LIVE_SESSION_HOURS, and for a
# start an open PR. For a resume, a [POLLING-STATE] or a commit counts only
# if it is no older than the ruling. The status is not read as a claim. A
# local session that has posted nothing and pushed nothing is invisible
# here, and nothing protects it. A dispatch that names a ticket skips the
# selection, and with it this check, but still posts its [CLAIM].
#
# One ticket per run (TAC-447). Each session gets its own turn limit, so an
# expensive ticket never uses up another ticket's turns. The cost is
# throughput: a second ready ticket waits for the next scheduled run, which on
# 2026-09-17 came 2.3 to 3.2 hours later. Ruled acceptable.
#
# "Newest comment" skips [SLACK], [CLAIM], [RESUME-CLAIM], [DENIALS] and
# [OVER-LIMIT] bookkeeping, so a Slack marker or a claim never buries a ruling.
#
# Blocked on Jaipal is a label, not a status: nothing here moves a ticket
# between statuses.
#
# Every ticket is CLAIMED before Claude runs: a resume with [RESUME-CLAIM],
# so a run that dies without posting cannot be retried forever (two attempts
# per ruling, then the ticket sits visibly stuck; bounded stuck beats
# unbounded spend), and a start with [CLAIM], so a local session can see the
# run has it. The selection ignores both: the concurrency group runs one
# build at a time, so an earlier run's claim is from a run that is over.
#
# Which tickets are this repo's: the label narrows, the Repo: line decides
# (.claude/process.md, "Which repo works a ticket"). One ticket, one repo:
# a ticket with two repo labels is never built, and neither is one whose
# Repo: line names more than one repo. The repo that would have built it
# posts [BUILD-SKIPPED] saying it needs splitting, adds Needs Decision, and
# moves on.
#
# dry_run (manual dispatch only) prints what the run would start, resume and
# flag, and writes nothing to Linear.
#
# After the session, a shell step checks that it posted on every ticket it
# worked. A session that cannot write to Linear cannot report its own
# failure, so the check is the workflow's, not the session's. A ticket left
# without a comment gets [SILENT-RUN] and the run fails. Permission denials
# are counted in the log on every run.
#
# The same step reports the turn limit, through scripts/run-report.mjs. A
# session the CLI stopped at the limit gets [TURN-LIMIT]: it blocks like
# [SILENT-RUN] and names what reached GitHub and what died with the runner. A
# session that finished but went over the limit, which claude-code-action
# fails after the fact (run 35288433905: 128 turns against 120), gets
# [OVER-LIMIT] bookkeeping, and the run stays failed. max_turns (manual
# dispatch only) lowers the limit so a fixture ticket can reach the first case.
# The check runs a copy of the reporter taken before the session, never the
# checkout's own: by then the checkout is the session's branch, which may be
# older than the reporter or be editing it.
#
# full_output (manual dispatch only) prints the session transcript into the
# run log. Off by default: this repo is public, so the log is too, and a
# transcript of a real ticket carries guest message text.
#
# The Work session holds a Claude GitHub App token, which can write. The App
# is installed on more repos than this one, but the token claude-code-action
# mints for this job reaches only this repo: run 35175673627 repeated the
# action's exchange on 2026-09-17 and GET /installation/repositories listed
# exactly one, analog-guest. Build keeps the App token rather than the job's
# own: a PR opened with the job token triggers no other workflows, so build's
# PRs would get no CI and no preview build.
#
# Known unknown: which permissions that token carries inside this repo. The
# exchange sends no permissions request and its response states only the
# expiry, so nothing here shows, for example, whether the session can push a
# change to a file under .github/workflows, which needs the workflows
# permission. Not chased further.
#
# The Claude step does not run from a branch whose copy of this file differs
# from main's: claude-code-action skips itself ("Workflow validation failed")
# and exits green. The shell steps still run from the branch. So the ticket
# selection (with dry_run), and the check's handling of a session that posted
# nothing, can be tested before merge on a fixture ticket. The turn-limit
# notices and anything the session does can be tested only after it merges.
# Run 35149594063 is the example: the session skipped, and the check posted
# [SILENT-RUN] on fixture TAC-430. .claude/process.md, "Testing a workflow
# change", has the procedure.
#
# Scheduled workflows run only from the default branch.

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [ticket-ready]
  workflow_dispatch:
    inputs:
      ticket:
        description: "Work one specific ticket (e.g. TAC-403). Blank = whatever is Ready or newly ruled."
        required: false
        type: string
      dry_run:
        description: "Print what would be started, resumed and flagged. Writes nothing."
        required: false
        default: false
        type: boolean
      full_output:
        description: "Print the session transcript in the run log. This repo is public: use it only on a fixture ticket."
        required: false
        default: false
        type: boolean
      max_turns:
        description: "Turn limit for this run's session. Lower it only on a fixture ticket, to reach the turn-limit notice."
        required: false
        default: 120
        type: number

concurrency:
  group: ticket-builds-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # One turn limit, read by the session and by the check that reports on
    # it. Scheduled and repository_dispatch runs have no inputs, so they get
    # 120.
    env:
      MAX_TURNS: ${{ inputs.max_turns || 120 }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # work-ticket.md's typecheck, lint and test gates all need these.
      - name: Install dependencies
        run: npm ci

      - name: Find tickets to work
        id: queue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          ONE_TICKET: ${{ inputs.ticket || github.event.client_payload.ticket }}
          DRY_RUN: ${{ inputs.dry_run }}
          # One ticket per session (TAC-447): see the header.
          LIMIT: "1"
          MAX_ATTEMPTS: "2"
          # How long a session's trace keeps a ticket claimed: a [CLAIM] or
          # [POLLING-STATE] since its last edit, a commit since it was made.
          # Without a window, a session that died would hold its ticket
          # forever (scripts/claims.mjs).
          LIVE_SESSION_HOURS: "3"
          # scripts/claims.mjs lists open PRs with gh.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The check after Work counts only comments newer than this.
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          if [ -n "${ONE_TICKET:-}" ]; then
            echo "defects=[]" >> "$GITHUB_OUTPUT"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "Dry run: would work $ONE_TICKET. Nothing worked."
              echo "tickets=" >> "$GITHUB_OUTPUT"
            else
              # work-ticket.md's own gate refuses a ticket this repo can't
              # build. A named ticket skips the selection and the claim
              # check, but is still claimed, so a local session can see the
              # run has it. The helper takes the id in uppercase.
              NAMED=$(echo "$ONE_TICKET" | tr '[:lower:]' '[:upper:]')
              printf '**[FROM CLAUDE CODE]**\n\n[CLAIM] %s run=%s\n' "$NAMED" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/claim-$NAMED.md"
              node scripts/linear.mjs comment "$NAMED" "$RUNNER_TEMP/claim-$NAMED.md"
              echo "tickets=$ONE_TICKET" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          RESPONSE=$(curl -sS https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "$(jq -nc --arg repo "$REPO_NAME" '{
              query: "query($repo: String!) { issues(first: 100, filter: { team: { key: { eq: \"TAC\" } }, state: { name: { in: [\"Ready\", \"In Progress\"] } }, labels: { some: { name: { eq: $repo } } } }) { nodes { id identifier description priority state { name } labels { nodes { name } } comments(first: 250) { nodes { id body createdAt updatedAt } } } } }",
              variables: { repo: $repo }
            }')")

          if ! echo "$RESPONSE" | jq -e '.data.issues.nodes' > /dev/null; then
            echo "::error::Linear query failed: $RESPONSE"
            exit 1
          fi

          RULES='
            # The repo rule from .claude/process.md. Kept identical in
            # audit-new-todo.yml.
            def repo_labels: [.labels.nodes[].name | select(startswith("analog-"))];
            def repo_line_names:
              [(.description // "") | capture("(?:^|\\n)[ \\t>*_]*Repos?[*_]*[ \\t]*:(?<line>[^\\n]*)"; "i") | .line]
              | if length == 0 then []
                else [.[0] | gsub("<[^>]*>"; "") | gsub("https?://[^\\s)>]*"; "") | scan("analog-[a-z]+(?:-[a-z]+)*"; "i") | ascii_downcase]
                end;
            def owner:
              repo_labels as $labels
              | repo_line_names as $named
              | ([$named[] | select(. as $n | $labels | any(. == $n))] | first) as $pick
              # A line naming more than one repo is a defect whatever the
              # labels say: the repo it is NOT labelled for never sees the
              # ticket at all, so a silent pick here is a silent half-build.
              | if ($named | length) > 1 then "defect:multi-repo-line"
                elif $pick != null then $pick
                elif ($named | length) > 0 then "defect:unlabelled"
                elif ($labels | length) == 1 then $labels[0]
                elif ($labels | length) == 0 then "none"
                else "defect:no-repo-line"
                end;
            def has_label($name): [.labels.nodes[].name] | any(. == $name);
            # Provenance is the prefix; a comment marker is the first marker
            # after it (.claude/process.md). $m may be an alternation.
            def is_bot: test("^\\s*\\*\\*\\[FROM CLAUDE CODE\\]\\*\\*");
            def marker_is($m): test("^\\s*\\*\\*\\[FROM CLAUDE CODE\\]\\*\\*\\s*\\[(?:" + $m + ")\\]");
            def build_skipped: [.comments.nodes[].body] | map(marker_is("BUILD-SKIPPED")) | any;
          '

          # Every candidate, in priority order. The limit is applied after
          # the claim check below, so a claimed ticket never uses it up.
          CANDIDATES=$(echo "$RESPONSE" | jq -c \
            --arg repo "$REPO_NAME" \
            --argjson maxAttempts "$MAX_ATTEMPTS" "$RULES"'
            .data.issues.nodes

            # this repo only, and only a ticket with one repo label
            | map(select(owner == $repo and (repo_labels | length) == 1))

            | map(
                [.labels.nodes[].name] as $labels
                | (.comments.nodes | sort_by(.createdAt)) as $sorted
                # the newest comment that is a turn: bookkeeping skipped
                | ($sorted | map(select(.body | marker_is("CLAIM|RESUME-CLAIM|SLACK|DENIALS|OVER-LIMIT") | not)) | last) as $newest
                | . + {
                    blocked: ($labels | any(. == "Needs Decision" or . == "Needs Action")),
                    newestId: ($newest.id // ""),
                    # when the ruling landed: on a resume, only a claim
                    # newer than it counts
                    newestAt: ($newest.createdAt // ""),
                    lastIsHuman: (
                      if $newest == null then false
                      else ($newest.body | is_bot | not)
                      end
                    ),
                    # how many times CI has already claimed this exact ruling
                    attempts: (
                      [ $sorted[]
                        | select(.body | marker_is("RESUME-CLAIM"))
                        | select(.body | test("ruling=" + ($newest.id // "none")))
                      ] | length
                    )
                  }
              )

            # START: Ready, unblocked.
            # RESUME: blocked on Jaipal, a human spoke last, attempts left.
            # Whether another session has it is for the claim check, below.
            | map(
                if .state.name == "Ready" and (.blocked | not)
                then . + { mode: "start" }
                elif .blocked and .lastIsHuman and .attempts < $maxAttempts
                then . + { mode: "resume" }
                else empty
                end
              )

            | sort_by(if .priority == 0 then 99 else .priority end)
            | map({ id, identifier, newestId, newestAt, mode, state: .state.name, comments: .comments.nodes })
          ')

          # Skip any ticket another session has, then take LIMIT. Prints a
          # "skipped ... another session has it" line for each one passed
          # over. Fails the step when it can't check (scripts/claims.mjs).
          SELECTED=$(echo "$CANDIDATES" | node scripts/claims.mjs)

          # Tickets this repo would have built but can't: two repo labels, or
          # a Repo: line naming no labelled repo. Noticed once; noticed again
          # only if Needs Decision was removed without fixing the ticket.
          DEFECTS=$(echo "$RESPONSE" | jq -c \
            --arg repo "$REPO_NAME" "$RULES"'
            .data.issues.nodes
            | map(select(
                ((owner == $repo and (repo_labels | length) >= 2)
                  or (owner | startswith("defect:")))
                and ((build_skipped and has_label("Needs Decision")) | not)
              ))
            | map({ id, identifier, hasNeedsDecision: has_label("Needs Decision"), labels: (repo_labels | sort), named: repo_line_names })
          ')

          TICKETS=$(echo "$SELECTED" | jq -r 'map(.identifier) | join(" ")')
          echo "$SELECTED" | jq -r '.[] | "\(.mode): \(.identifier) (\(.state))"'
          echo "$DEFECTS" | jq -r '.[] | "flag: \(.identifier)"'

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run: no claims or flags written, nothing worked."
            echo "tickets=" >> "$GITHUB_OUTPUT"
            echo "defects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Claim every ticket before Claude runs. A resume's claim also
          # counts attempts: if the run dies, it is already recorded and the
          # count holds. A start's tells a local session the run has it.
          echo "$SELECTED" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r .id)
            NAME=$(echo "$row" | jq -r .identifier)
            if [ "$(echo "$row" | jq -r .mode)" = "resume" ]; then
              MARK="[RESUME-CLAIM] ruling=$(echo "$row" | jq -r .newestId) run=${GITHUB_RUN_ID}"
            else
              MARK="[CLAIM] ${NAME} run=${GITHUB_RUN_ID}"
            fi
            BODY="**[FROM CLAUDE CODE]**

          ${MARK}"
            curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$(jq -nc --arg id "$ID" --arg body "$BODY" \
                  '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
            echo "claimed $NAME"
          done

          if [ -z "$TICKETS" ]; then
            echo "Nothing to work."
          else
            echo "Working: $TICKETS"
          fi
          echo "tickets=$TICKETS" >> "$GITHUB_OUTPUT"
          echo "defects=$DEFECTS" >> "$GITHUB_OUTPUT"

      - name: Flag tickets that can't be built
        if: steps.queue.outputs.defects != '' && steps.queue.outputs.defects != '[]'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DEFECTS: ${{ steps.queue.outputs.defects }}
        run: |
          set -euo pipefail

          gql() {
            curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$1"
          }

          LABEL_ID=$(gql '{"query":"query { issueLabels(filter: { name: { eq: \"Needs Decision\" } }) { nodes { id } } }"}' \
            | jq -r '.data.issueLabels.nodes[0].id // empty')
          if [ -z "$LABEL_ID" ]; then
            echo "::error::No Needs Decision label found in Linear."
            exit 1
          fi

          echo "$DEFECTS" | jq -c '.[]' | while read -r row; do
            ID=$(echo "$row" | jq -r .id)
            NAME=$(echo "$row" | jq -r .identifier)
            # The two-label wording is .claude/process.md's, word for word.
            TEXT=$(echo "$row" | jq -r '
              if (.named | length) > 1
              then "This ticket can'"'"'t be built. Its Repo: line names \(.named | join(" and ")), and cross-repo work is two tickets, one per repo, linked. A line naming more than one repo is a defect whatever the labels say: the repo it is not labelled for never sees this ticket, so nothing there picks it up and nothing there says why.\n\nSplit it: one ticket per repo, each with its own repo label and a Repo: line naming only that repo, linked to each other. Replying here will not unblock it: the ticket needs splitting."
              elif (.labels | length) >= 2
              then "This ticket can'"'"'t be built. It carries the \(.labels | join(" and ")) labels, and cross-repo work is two tickets, one per repo, linked. Built as one ticket, only one repo would build it and the other half would never be built.\n\nSplit it: one ticket per repo, each with its own repo label and Repo: line, linked to each other. Replying here will not unblock it: the ticket needs splitting."
              else "This ticket can'"'"'t be built. Its Repo: line names \(.named | join(" and ")), and the ticket carries no label for \(if (.named | length) == 1 then "it" else "any of them" end).\n\nFix the Repo: line or the repo label so they agree. Replying here will not unblock it."
              end')
            BODY="**[FROM CLAUDE CODE]**

          [BUILD-SKIPPED] ${NAME}

          ${TEXT}"

            gql "$(jq -nc --arg id "$ID" --arg body "$BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
            if [ "$(echo "$row" | jq -r .hasNeedsDecision)" != "true" ]; then
              gql "$(jq -nc --arg id "$ID" --arg label "$LABEL_ID" \
                '{query: "mutation($id: String!, $label: String!) { issueAddLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
                | jq -e '.data.issueAddLabel.success' > /dev/null
            fi
            echo "flagged $NAME"
          done

      # The check after the session reports through scripts/run-report.mjs.
      # By then the checkout is on the session's branch, which can predate the
      # script or be a ticket that edits it, so the check runs this copy,
      # taken from the checkout before the session starts (main, on every
      # scheduled run). It lives outside the checkout.
      - name: Keep a copy of the turn-limit reporter
        if: steps.queue.outputs.tickets != ''
        env:
          REPORTER_DIR: ${{ runner.temp }}/turn-limit-reporter
        run: |
          set -euo pipefail
          mkdir -p "$REPORTER_DIR/lib"
          cp scripts/run-report.mjs "$REPORTER_DIR/"
          cp scripts/lib/run-report.mjs scripts/lib/linear-cli.mjs scripts/lib/comment-provenance.mjs "$REPORTER_DIR/lib/"

      - name: Work
        id: work
        if: steps.queue.outputs.tickets != ''
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.full_output == true }}
          claude_args: |
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(npx tsc:*),Bash(npx vitest:*),Bash(npm run lint:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git fetch:*),Bash(git pull:*),Bash(git checkout main),Bash(git checkout -b:*),Bash(git checkout jaipal/:*),Bash(git branch --list:*),Bash(git branch --show-current),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh workflow list:*),Bash(curl:*),Bash(jq:*),Bash(rg:*),Bash(python3:*),Bash(node:*)"
            --disallowedTools "Bash(npx supabase:*),Bash(npx tsx:*),Bash(git reset:*),Bash(git clean:*),Bash(git branch -D:*)"
          prompt: |
            You are working a Linear ticket for the repo ${{ github.event.repository.name }}.

            Ticket: ${{ steps.queue.outputs.tickets }}

            Read CLAUDE.md and .claude/process.md first. Then follow
            .claude/commands/work-ticket.md for it — it is the specification
            for this task and it governs.

            Dependencies are already installed. Do not run npm install.

            YOU HAVE ${{ env.MAX_TURNS }} TURNS. When they run out the session
            stops, and anything not pushed is lost with the runner. Push each
            commit the plan names as soon as it is made (work-ticket.md
            Phase 3). Never save pushes for the end.

            LINEAR, FROM CI. There is no Linear MCP here. Read with curl, and
            write with the checked-in helper, node scripts/linear.mjs. The key
            is in the LINEAR_API_KEY environment variable; the helper reads it
            itself.

            YOUR BASH IS RESTRICTED, AND A DENIED COMMAND FAILS SILENTLY.
            These are denied however you arrange them: expanding an
            environment variable ($LINEAR_API_KEY or ${LINEAR_API_KEY}),
            command substitution ($(...) or backticks), variable assignment
            (NAME=...), output redirection in every form, including >, >> and
            2>&1 — a command cannot capture its own stderr — and heredocs
            (<<). This workflow's own shell steps use those forms; you cannot.

            SHELL TOOLS CANNOT TOUCH FILES OUTSIDE THIS CHECKOUT. Claude Code
            checks the file arguments of jq, rg, grep, cat, wc, sed, head and
            tail, and refuses any path outside this checkout, whatever the
            allowlist says. ${{ runner.temp }} is outside it, and so are the
            files Claude Code saves a large response to. Open those files with
            the Read tool, never with a shell command. A pipeline or && chain
            is refused whole if any part of it is refused.

            Use exactly these two forms.

            1. A read, with the request inline in single quotes:

                 curl -sS https://api.linear.app/graphql --variable %LINEAR_API_KEY --expand-header "Authorization: {{LINEAR_API_KEY}}" -H "Content-Type: application/json" -d '{"query":"query { issue(id: \"TAC-395\") { id identifier title description state { name } labels { nodes { id name } } comments(first: 250) { nodes { id body createdAt } } } }"}'

               Piping the response to jq is allowed: append | jq '...'. For
               the description as plain markdown, append
               | jq -r '.data.issue.description'. A response too large to show
               is saved to a file: open that file with the Read tool.

            2. Every write, with the helper. For a comment or a description,
               first use the Write tool to write the text as plain markdown,
               with nothing escaped, to a new file under ${{ runner.temp }}.
               The temp folder already exists, do not create it. Give every
               write its own file name; never reuse one. Then:

                 node scripts/linear.mjs comment TAC-395 ${{ runner.temp }}/tac-395-plan.md
                 node scripts/linear.mjs describe TAC-395 ${{ runner.temp }}/tac-395-description.md
                 node scripts/linear.mjs label add TAC-395 "Needs Decision"
                 node scripts/linear.mjs label remove TAC-395 "Needs Decision"
                 node scripts/linear.mjs state TAC-395 Ready

               The helper takes a ticket identifier and plain names, and looks
               up every id itself. It posts comments flat, and refuses one that
               does not open with **[FROM CLAUDE CODE]**, a blank line, then its
               marker. describe replaces the whole description: read it first,
               edit it, and write all of it back. The helper prints a line
               starting "ok:" and exits 0 only when Linear returns
               "success": true. Anything else is a failed write, not a finished
               step: read the error, fix the cause, and run it again.

            READ FILES WITH THE READ TOOL AND SEARCH WITH THE GREP TOOL OR rg,
            never with a shell pipeline. cat, grep, cut, wc and env are not
            available.

            After you finish, this workflow checks that you posted a comment
            on the ticket, and counts your permission denials. If you posted
            nothing, the ticket gets a [SILENT-RUN] notice and the run fails.
            If you ran out of turns, it gets a [TURN-LIMIT] notice saying what
            you pushed.

            NO SCHEDULEWAKEUP IN CI. There is no harness to re-fire this
            session. Wherever work-ticket.md says to write [POLLING-STATE]
            and ScheduleWakeup, instead:
              - add the right Blocked On label (Needs Decision or Needs
                Action) and leave the status alone
              - post the comment work-ticket.md specifies
              - exit
            This workflow resumes the ticket on its next scheduled run after
            Jaipal replies. That can be hours.

            A PLAN IS A DECISION. After posting a plan, prefix it [PLAN], add
            the Needs Decision label, leave the status alone, and stop. Never
            build on an unapproved plan.

            RESUMING. If the newest comment on a ticket, skipping [SLACK],
            [CLAIM], [RESUME-CLAIM], [DENIALS] and [OVER-LIMIT]
            bookkeeping, is human input, that is Jaipal's
            ruling, often a Slack reply. Apply it to ## Open questions BEFORE
            checking whether any question is still open (work-ticket.md Phase
            0 step 2b, then 2c). Checking first finds his own question still
            there and ignores his answer. Then continue from where the earlier
            session stopped. Do not change the status. If the ticket's branch
            is on GitHub, check it out (work-ticket.md Phase 3 step 14) and
            read `git log` and `git diff` against main to establish what is
            already done.

            ALWAYS POST BEFORE YOU EXIT. Every ticket you touch ends with a
            comment saying what happened, even if the answer is "nothing, and
            here is why". A [CLAIM] or [RESUME-CLAIM] this workflow posted is
            not that comment, and you post no [CLAIM] of your own. If you
            cannot match Jaipal's answer to the open
            questions, post [NEEDS-INPUT] saying which questions are still
            open and why his reply didn't settle them (work-ticket.md Phase 0
            step 2c). A quiet exit leaves the ticket looking exactly like one
            still waiting for him.

            Commit and push only to the ticket's own branch, never to main.
            Never merge, and never mark a ticket Done.

      - name: Check the session posted on every ticket it worked
        if: ${{ !cancelled() && steps.queue.outputs.tickets != '' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKETS: ${{ steps.queue.outputs.tickets }}
          STARTED: ${{ steps.queue.outputs.started }}
          WORK_OUTCOME: ${{ steps.work.outcome }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The copy taken before the session, not the checkout's scripts/.
          REPORTER: ${{ runner.temp }}/turn-limit-reporter/run-report.mjs
        run: |
          set -euo pipefail

          gql() {
            curl -sS https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "$1"
          }

          # What the session did, from the action's own record of it
          # ($RUNNER_TEMP/claude-execution-output.json, written even when the
          # session fails). This log is public, so only counts are printed;
          # denied commands go to Linear, which is not.
          if [ -f "$EXECUTION_FILE" ]; then
            SESSION=$(jq -c --arg key "$LINEAR_API_KEY" '
              ([.[] | select(.type == "result")] | last) as $r
              | {
                  ended: ($r.subtype // "without a result"),
                  turns: ($r.num_turns // 0),
                  denials: (($r.permission_denials // []) | length),
                  denied: [ ($r.permission_denials // [])[:20][]
                    | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // (.tool_input | tostring))"
                    | gsub("\\s+"; " ") | gsub("`"; "\u02cb")
                    | (if ($key | length) > 0 then (split($key) | join("***")) else . end)
                    | .[0:2000] ]
                }' "$EXECUTION_FILE")
          else
            SESSION='{"ended":"without a session record","turns":0,"denials":0,"denied":[]}'
          fi
          ENDED=$(echo "$SESSION" | jq -r .ended)
          TURNS=$(echo "$SESSION" | jq -r .turns)
          DENIALS=$(echo "$SESSION" | jq -r .denials)
          DENIED=$(echo "$SESSION" | jq -r '.denied | if length == 0 then "(none)" else map("- " + .) | join("\n") end')
          echo "Session ended $ENDED after $TURNS turns, with $DENIALS permission denials."
          if [ "$DENIALS" -gt 0 ]; then
            echo "::warning title=Permission denials::The session hit $DENIALS permission denials."
          fi

          # How the session ended against its turn limit (TAC-447; see the
          # header). stopped-at-limit posts [TURN-LIMIT], finished-over-limit
          # posts [OVER-LIMIT] bookkeeping. If the script fails, ENDING is
          # unknown and the check behaves exactly as it did before TAC-447.
          ENDING=$(node "$REPORTER" ending "$EXECUTION_FILE" "$MAX_TURNS") || ENDING="unknown"
          echo "Turn limit $MAX_TURNS; ending: $ENDING."
          notice() {
            DENIALS="$DENIALS" DENIED="$DENIED" node "$REPORTER" notice "$1" "$EXECUTION_FILE" "$MAX_TURNS"
          }

          post() {
            gql "$(jq -nc --arg id "$1" --arg body "$2" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
          }

          # Puts a ticket in front of Jaipal: adds Needs Decision unless a
          # Blocked On label is already on. $1 is the issue id, $2 the issue
          # as the loop below reads it.
          block() {
            if echo "$2" | jq -e '[.data.issue.labels.nodes[].name] | any(. == "Needs Decision" or . == "Needs Action")' > /dev/null; then
              return 0
            fi
            LABEL_ID=$(gql '{"query":"query { issueLabels(filter: { name: { eq: \"Needs Decision\" } }) { nodes { id } } }"}' \
              | jq -r '.data.issueLabels.nodes[0].id // empty')
            if [ -z "$LABEL_ID" ]; then
              echo "::error::No Needs Decision label found in Linear."
              exit 1
            fi
            gql "$(jq -nc --arg id "$1" --arg label "$LABEL_ID" \
              '{query: "mutation($id: String!, $label: String!) { issueAddLabel(id: $id, labelId: $label) { success } }", variables: {id: $id, label: $label}}')" \
              | jq -e '.data.issueAddLabel.success' > /dev/null
          }

          # A run that succeeds with denials looks identical to one without,
          # so the denials go on the ticket as bookkeeping every time: a
          # denial on a finished run usually means a prompt teaches a form the
          # allowlist refuses. The automation ignores [DENIALS].
          FENCE='```'
          post_denials() {
            BODY="**[FROM CLAUDE CODE]**

          [DENIALS] $2 run=${GITHUB_RUN_ID} count=${DENIALS}

          This run's session did its work on this ticket but hit ${DENIALS} permission denials on the way. A denial on a run that otherwise succeeded usually means a prompt teaches a command the allowlist refuses. Bookkeeping: the automation ignores this comment.

          Denied, first 20, key redacted:

          ${FENCE}text
          ${DENIED}
          ${FENCE}

          Run: ${RUN_URL}"
            gql "$(jq -nc --arg id "$1" --arg body "$BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')" \
              | jq -e '.data.commentCreate.success' > /dev/null
            echo "$2: posted [DENIALS] for $DENIALS denial(s)."
          }

          SILENT=""
          LIMITED=""
          for TICKET in $TICKETS; do
            ISSUE=$(gql "$(jq -nc --arg t "$TICKET" \
              '{query: "query($t: String!) { issue(id: $t) { id labels { nodes { name } } comments(first: 250) { nodes { body createdAt } } } }", variables: {t: $t}}')")
            ID=$(echo "$ISSUE" | jq -er '.data.issue.id')

            # A comment the session posted during this run: prefixed, newer
            # than the run's start, and not workflow bookkeeping or a notice.
            POSTED=$(echo "$ISSUE" | jq --arg started "$STARTED" '
              ($started | fromdateiso8601) as $since
              | [.data.issue.comments.nodes[]
                  | select((.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) >= $since)
                  | select(.body | test("^\\s*\\*\\*\\[FROM CLAUDE CODE\\]\\*\\*"))
                  | select(.body | test("^\\s*\\*\\*\\[FROM CLAUDE CODE\\]\\*\\*\\s*\\[(?:CLAIM|RESUME-CLAIM|SLACK|DENIALS|SILENT-RUN|TURN-LIMIT|OVER-LIMIT)\\]") | not)]
              | length')

            # Stopped at the limit: the work is incomplete whatever the
            # session posted, so [TURN-LIMIT] takes the place of [SILENT-RUN]
            # and [DENIALS]. It carries the denied list itself.
            if [ "$ENDING" = "stopped-at-limit" ]; then
              BODY=$(notice "$TICKET") || BODY=""
              if [ -n "$BODY" ]; then
                LIMITED="$LIMITED $TICKET"
                echo "::error title=Turn limit::$TICKET: the session was stopped at its turn limit of $MAX_TURNS. Posting [TURN-LIMIT]."
                post "$ID" "$BODY"
                block "$ID" "$ISSUE"
                continue
              fi
            fi

            if [ "$POSTED" -gt 0 ]; then
              echo "$TICKET: the session posted $POSTED comment(s)."
              if [ "$ENDING" = "finished-over-limit" ]; then
                BODY=$(notice "$TICKET") || BODY=""
                # Bookkeeping: a failed post must not stop [DENIALS] below.
                if [ -n "$BODY" ]; then
                  if post "$ID" "$BODY"; then
                    echo "$TICKET: posted [OVER-LIMIT], $TURNS turns against a limit of $MAX_TURNS."
                  else
                    echo "::warning title=Turn limit::$TICKET: posting [OVER-LIMIT] failed."
                  fi
                fi
              fi
              if [ "$DENIALS" -gt 0 ]; then
                post_denials "$ID" "$TICKET"
              fi
              continue
            fi

            SILENT="$SILENT $TICKET"
            echo "::error title=Silent run::$TICKET: the session worked this ticket and posted nothing. Posting [SILENT-RUN]."

            BODY="**[FROM CLAUDE CODE]**

          [SILENT-RUN] ${TICKET}

          The build workflow worked this ticket and its session posted nothing, so nothing here says what it did. This notice comes from the workflow, not the session: a session that cannot write to Linear cannot report its own failure.

          - Run: ${RUN_URL}
          - Work step: ${WORK_OUTCOME}. The session ended ${ENDED} after ${TURNS} turns, against a limit of ${MAX_TURNS}.
          - Permission denials: ${DENIALS}

          Denied, first 20, key redacted:

          ${FENCE}text
          ${DENIED}
          ${FENCE}

          Read the run before replying. A reply here resumes the ticket on the next scheduled run, and until the cause is fixed the same failure repeats."

            post "$ID" "$BODY"
            block "$ID" "$ISSUE"
          done

          if [ -n "$LIMITED" ]; then
            echo "::error title=Turn limit::Stopped at the turn limit of $MAX_TURNS on:$LIMITED"
          fi

          # A silent run is a failed run. Green would say the opposite.
          if [ -n "$SILENT" ]; then
            echo "::error title=Silent run::No comment from the session on:$SILENT"
          fi
          if [ -n "$SILENT" ] || [ -n "$LIMITED" ]; then
            exit 1
          fi
