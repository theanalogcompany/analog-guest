name: Slack rulings sync

# Two-way sync between tickets blocked on Jaipal (any open ticket carrying
# Needs Decision or Needs Action) and the #rulings Slack channel.
# Runs in analog-guest only — this is workspace-wide, not per-repo.
#
# On each scheduled run (GitHub runs it hours apart, not every 5 minutes;
# TAC-428):
#   - any ticket newly carrying a Blocked On label gets one Slack message
#   - any reply in one of those threads becomes a Linear comment, which the
#     build workflow reads as a ruling on its own next run
#
# Scheduled workflows run only from the default branch.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: slack-rulings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node scripts/slack-rulings.mjs
